<ion-app>
  <!-- Main Menu - placed at app level so it persists across navigation -->
  <ion-menu side="end" menuId="main-menu" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
        <ion-buttons slot="end">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content [scrollY]="true">
      <ion-list>
        <ion-item button routerLink="/home" routerDirection="root">
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item button routerLink="/about" routerDirection="root">
          <ion-label>About</ion-label>
        </ion-item>
        <ion-item button routerLink="/who-was-thekla" routerDirection="root">
          <ion-label>Who Was Thekla?</ion-label>
        </ion-item>
        <ion-item button routerLink="/join-us" routerDirection="root">
          <ion-label>Join Us</ion-label>
        </ion-item>
        <ion-item button routerLink="/rule-of-life" routerDirection="root">
          <ion-label>Rule of Life</ion-label>
        </ion-item>
        <ion-item button routerLink="/devotions" routerDirection="root">
          <ion-label>Devotions</ion-label>
        </ion-item>
        <ion-item button routerLink="/ministry-support" routerDirection="root">
          <ion-label>Ministry & Support</ion-label>
        </ion-item>
        <ion-item button routerLink="/donate" routerDirection="root">
          <ion-label>Donate</ion-label>
        </ion-item>
        <ion-item button routerLink="/contact" routerDirection="root">
          <ion-label>Contact</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
